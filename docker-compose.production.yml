name: pupilovo-production
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    networks: [internal]
  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${DB_NAME:?Set DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER:?Set DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', 'https://${SHOP_DOMAIN:?Set SHOP_DOMAIN}');
        define('WP_SITEURL', 'https://${SHOP_DOMAIN:?Set SHOP_DOMAIN}');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/pupilovo-auth:/var/www/html/wp-content/plugins/pupilovo-auth:ro
      - ./wordpress/plugins/pupilovo-dropshipping:/var/www/html/wp-content/plugins/pupilovo-dropshipping:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, wordpress]
    networks: [internal]
networks:
  internal:
volumes:
  wp_data:
  mysql_data:
  caddy_data:
  caddy_config:
